# efeotomativadana — üretim tabanı.
# Yerelde `docker compose up` (override otomatik dev'e çevirir).
# Sunucuda prod: `docker compose -f compose.yaml up -d --build`
# NOT: doctrine recipe'i postgres getirdi; proje MySQL 8.4 kullanıyor (bilinçli el değişikliği).
# UYARI: `composer update` doctrine recipe'ini güncellerse Flex buraya postgres
# bloğu yeniden ekleyebilir (###> doctrine/doctrine-bundle ###). Öyle olursa
# eklenen bloğu sil, MySQL servisini koru.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-:80}
      APP_ENV: ${APP_ENV:-prod}
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/${MYSQL_DATABASE:-app}?serverVersion=8.4&charset=utf8mb4
      MAILER_DSN: ${MAILER_DSN:-smtp://mailer:1025}
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
      EFE_B2B_FEED_URL: ${EFE_B2B_FEED_URL:-https://b2b.efeotoyedekparca.com.tr/json-tum-gercek-stoklar.php}
      EFE_B2B_ALLOWED_HOSTS: ${EFE_B2B_ALLOWED_HOSTS:-b2b.efeotoyedekparca.com.tr}
      EFE_B2B_CA_BUNDLE: ${EFE_B2B_CA_BUNDLE:-}
      EFE_B2B_SNAPSHOT_DIR: ${EFE_B2B_SNAPSHOT_DIR:-var/b2b-snapshots}
      EFE_B2B_PRODUCT_MEDIA_DIR: ${EFE_B2B_PRODUCT_MEDIA_DIR:-public/uploads/products}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTPS_PORT:-8443}:443/udp"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - cms_media:/app/public/uploads/cms
      - product_media:/app/public/uploads/products
      - b2b_snapshots:/app/var/b2b-snapshots

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    command: ["php", "-d", "memory_limit=512M", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=480M", "--sleep=1"]
    environment:
      APP_ENV: ${APP_ENV:-prod}
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/${MYSQL_DATABASE:-app}?serverVersion=8.4&charset=utf8mb4
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
      EFE_B2B_FEED_URL: ${EFE_B2B_FEED_URL:-https://b2b.efeotoyedekparca.com.tr/json-tum-gercek-stoklar.php}
      EFE_B2B_ALLOWED_HOSTS: ${EFE_B2B_ALLOWED_HOSTS:-b2b.efeotoyedekparca.com.tr}
      EFE_B2B_CA_BUNDLE: ${EFE_B2B_CA_BUNDLE:-}
      EFE_B2B_SNAPSHOT_DIR: ${EFE_B2B_SNAPSHOT_DIR:-var/b2b-snapshots}
      EFE_B2B_PRODUCT_MEDIA_DIR: ${EFE_B2B_PRODUCT_MEDIA_DIR:-public/uploads/products}
    depends_on:
      app:
        condition: service_started
      database:
        condition: service_healthy
    volumes:
      - product_media:/app/public/uploads/products
      - b2b_snapshots:/app/var/b2b-snapshots
    healthcheck:
      test: ["CMD", "php", "-r", "exit((int) !str_contains(file_get_contents('/proc/1/cmdline'), 'messenger:consume'));"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  database:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-!ChangeMeRoot!}
    volumes:
      - database_data:/var/lib/mysql
      - ./docker/mysql/init-test-database.sh:/docker-entrypoint-initdb.d/20-test-database.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_USER:-app}", "-p${MYSQL_PASSWORD:-!ChangeMe!}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailer:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  database_data:
  caddy_data:
  caddy_config:
  cms_media:
  product_media:
  b2b_snapshots:
