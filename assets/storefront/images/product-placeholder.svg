<?xml version="1.0" encoding="UTF-8"?>
<!--
  Product placeholder shown by the storefront whenever a product has no stored image.
  Most Efe B2B feed rows carry an empty "urunresimleri" list, so a neutral automotive
  icon sheet keeps catalogue, product, cart, wishlist and comparison grids from showing
  a broken or unrelated image. 5 columns x 4 rows on a light card background.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320" role="img" aria-label="Otomotiv yedek parça görseli bulunamadı">
  <rect width="400" height="320" fill="#f6f7f5"/>
  <g fill="none" stroke="#5a6068" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. engine -->
    <g transform="translate(8 8)">
      <rect x="8" y="28" width="34" height="16" rx="2"/>
      <path d="M17 28v-7h16v7M13 15h24M21 21v-6M29 21v-6M37 21v-6"/>
      <path d="M42 34h7a7 7 0 0 1 7 7v3H42"/>
      <path d="M8 44l6 8h26l6-8M19 32h7v8h-7z"/>
    </g>

    <!-- 2. car wash -->
    <g transform="translate(88 8)">
      <path d="M6 46h38l5-12h8l5 12h4v6H6z"/>
      <circle cx="17" cy="52" r="4"/>
      <circle cx="49" cy="52" r="4"/>
      <path d="M18 12h22v10H18zM24 12V7h10v5M14 17H8M50 17h6M20 30h-4M44 30h4"/>
    </g>

    <!-- 3. tyre -->
    <g transform="translate(168 8)">
      <circle cx="32" cy="32" r="24"/>
      <circle cx="32" cy="32" r="11"/>
      <path d="M32 8v13M32 43v13M8 32h13M43 32h13M15 15l9 9M40 40l9 9M49 15l-9 9M24 40l-9 9"/>
    </g>

    <!-- 4. battery -->
    <g transform="translate(248 8)">
      <rect x="8" y="20" width="48" height="30" rx="3"/>
      <path d="M18 20v-6h8v6M38 20v-6h8v6M16 28h-5v14h5M48 28h5v14h-5"/>
      <path d="M36 24l-11 12h9l-4 10 12-13h-9z"/>
    </g>

    <!-- 5. wrench and screwdriver -->
    <g transform="translate(328 8)">
      <path d="M14 52l24-24a10 10 0 0 1-11-13l6 6 5-5-6-6a10 10 0 0 1 13 11L21 45z"/>
      <path d="M46 12l-6 6 5 5 6-6M45 18L19 44"/>
