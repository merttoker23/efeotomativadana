      <path d="M6 44V24h22v20M28 32h12l6 8v4H28z"/>
      <circle cx="16" cy="48" r="5"/>
      <circle cx="40" cy="48" r="5"/>
      <path d="M36 32V14h8v10M44 14a6 6 0 1 1 0 10"/>
