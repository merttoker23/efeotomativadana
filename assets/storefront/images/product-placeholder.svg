    <g transform="translate(248 168)">
      <circle cx="32" cy="32" r="24"/>
      <circle cx="32" cy="32" r="10"/>
      <circle cx="32" cy="32" r="3"/>
      <path d="M32 20v6M32 38v6M20 32h6M38 32h6"/>
      <path d="M44 8h10v14H44a7 7 0 0 1 0-14z"/>
