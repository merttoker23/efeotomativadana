    <g transform="translate(88 88)">
      <path d="M10 30h28v22H10zM10 30l-4-6h32l-6 6"/>
      <path d="M24 30v-8h12v8M38 24l10-8v6"/>
      <path d="M50 30c4 5 5 8 5 11a5 5 0 0 1-10 0c0-3 1-6 5-11z"/>
