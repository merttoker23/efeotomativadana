      <path d="M26 12l6 6 6-6M26 52l6-6 6 6M12 26l8 1-3 7M52 26l-8 1 3 7M12 38l8-1-3-7M52 38l-8-1 3-7"/>
    </g>

    <!-- 20. fuel pump -->
    <g transform="translate(328 248)">
      <rect x="10" y="8" width="28" height="46" rx="3"/>
      <path d="M16 18h16v10H16zM10 34h28"/>
      <path d="M38 20h8a6 6 0 0 1 6 6v18a5 5 0 0 1-10 0V38h-4"/>
      <path d="M16 54v-6M24 54v-6"/>
