# Yerel geliştirme. `docker compose up` bunu otomatik birleştirir.
# Prod'da kullanılmaz: `docker compose -f compose.yaml up -d --build`
# UYARI: `composer update` Flex recipe blokları ekleyebilir (###> ... ###).
# Eklenirse silin; aşağıdaki el yazımı MySQL/Mailpit ayarları geçerlidir.
services:
  app:
    build:
      target: dev
    environment:
      APP_ENV: dev
      # .env dosyasındaki null://null değerini ezer, mailler Mailpit'e düşer:
      MAILER_DSN: smtp://mailer:1025
      DEFAULT_URI: http://localhost:8080
    volumes:
      - ./:/app
      # Windows bind-mount üzerinden vendor okumak on binlerce yavaş stat
      # demektir (ClassLoader timeout). Vendor Linux named volume'da kalır;
      # ilk `up`'ta imajdaki /app/vendor içeriğiyle dolar.
      - app_vendor:/app/vendor
      # OneDrive senkronunu ve kilitleri azaltmak için önbellek konteynerde kalır:
      - app_cache:/app/var/cache
      - ./public/uploads/cms:/app/public/uploads/cms
      - ./public/uploads/products:/app/public/uploads/products

  worker:
    build:
      target: dev
    environment:
      APP_ENV: dev
    volumes:
      - ./:/app
      - app_vendor:/app/vendor
      - app_cache:/app/var/cache
      - ./public/uploads/products:/app/public/uploads/products

  database:
    ports:
      - "3306"

  mailer:
    ports:
      # 1025/8025 başka projede (birdunyataki) dolu; çakışmayı önlemek için farklı host portları:
      - "1026:1025"
      - "8026:8025"

volumes:
  app_vendor:
  app_cache:
