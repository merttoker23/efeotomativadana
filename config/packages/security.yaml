security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        admin_users:
            entity:
                class: App\Entity\Customer\AdminUser
                property: email
        customer_users:
            entity:
                class: App\Entity\Customer\CustomerUser
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        admin:
            pattern: ^/admin(?:/|$)
            lazy: true
            provider: admin_users
            form_login:
                login_path: admin_login
                check_path: admin_login
                enable_csrf: true
                default_target_path: admin_dashboard
                always_use_default_target_path: true
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: admin_logout
                target: admin_login
                enable_csrf: true
        main:
            lazy: true
            provider: customer_users
            user_checker: App\Security\CustomerUserChecker
            form_login:
                login_path: customer_login
                check_path: customer_login
                enable_csrf: true
                default_target_path: customer_account_dashboard
                always_use_default_target_path: true
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: customer_logout
                target: customer_login
                enable_csrf: true

    access_control:
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin(?:/|$), roles: ROLE_ADMIN }
        - { path: ^/odeme/sonuc/, roles: PUBLIC_ACCESS }
        - { path: ^/odeme/iptal/, roles: PUBLIC_ACCESS }
        - { path: ^/odeme/paytr/bildirim$, roles: PUBLIC_ACCESS }
        - { path: ^/(?:odeme(?:/|$)|siparis/), roles: ROLE_CUSTOMER }
        - { path: ^/hesabim(?:/|$), roles: ROLE_CUSTOMER }

when@test:
    security:
        providers:
            test_non_admins:
                memory:
                    users:
                        viewer@example.com:
                            password: 'test-only-not-used-for-form-login'
                            roles: [ROLE_USER]
            test_admin_chain:
                chain:
                    providers: [admin_users, test_non_admins]
        firewalls:
            admin:
                provider: test_admin_chain
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10