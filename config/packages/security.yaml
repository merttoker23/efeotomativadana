security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        admin_users:
            entity:
                class: App\Entity\Customer\AdminUser
                property: email
        customer_users:
            entity:
                class: App\Entity\Customer\CustomerUser
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        admin:
            pattern: ^/yeni/admin
            lazy: true
            provider: admin_users
            form_login:
                login_path: admin_login
                check_path: admin_login
                enable_csrf: true
                default_target_path: admin_dashboard
                # A request-supplied _target_path would otherwise be honoured after a successful
                # login, so a victim who signs in to the genuine store could be redirected to a
                # lookalike that asks for their credentials a second time.
                always_use_default_target_path: true
            logout:
                path: admin_logout
                target: admin_login
                enable_csrf: true
        main:
            lazy: true
            provider: customer_users
            user_checker: App\Security\CustomerUserChecker
            form_login:
                login_path: customer_login
                check_path: customer_login
                enable_csrf: true
                default_target_path: customer_account_dashboard
                # See the admin firewall above: the post-login destination is never taken from
                # the request.
                always_use_default_target_path: true
            logout:
                path: customer_logout
                target: customer_login
                enable_csrf: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/yeni/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/yeni/admin, roles: ROLE_ADMIN }
        # Provider return and cancel addresses are reached by the gateway, not by a customer:
        # a server-to-server webhook has no session at all. Their safety comes from the
        # unguessable 64-hex return token plus the gateway's own signature check, so these
        # must be declared public or a charged order could never be confirmed.
        - { path: ^/yeni/odeme/sonuc/, roles: PUBLIC_ACCESS }
        - { path: ^/yeni/odeme/iptal/, roles: PUBLIC_ACCESS }
        # PayTR's notification URL is called by PayTR's own servers, with no session and no
        # cookie. It is addressed by the provider's order reference rather than a return token,
        # and its safety comes from the gateway's signature check over the raw post: nothing is
        # settled until that hash verifies. Declaring it public is what lets a real charge be
        # confirmed at all, and it must stay a POST-only endpoint that answers a plain `OK`.
        - { path: ^/yeni/odeme/paytr/bildirim$, roles: PUBLIC_ACCESS }
        - { path: ^/yeni/(odeme|siparis/), roles: ROLE_CUSTOMER }
        - { path: ^/yeni/hesabim, roles: ROLE_CUSTOMER }

when@test:
    security:
        providers:
            test_non_admins:
                memory:
                    users:
                        viewer@example.com:
                            password: 'test-only-not-used-for-form-login'
                            roles: [ROLE_USER]
            test_admin_chain:
                chain:
                    providers: [admin_users, test_non_admins]
        firewalls:
            admin:
                provider: test_admin_chain
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
