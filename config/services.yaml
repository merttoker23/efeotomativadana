# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Public URL prefix the storefront is published under. Single source of truth for
    # compiled assets (framework.assets.base_path) and stored media URLs
    # (App\Twig\StorefrontMediaExtension).
    app.public_base_path: '/yeni'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # Test adapters are registered explicitly in when@test below.
        exclude:
            - '../src/Module/Payment/FakePaymentGateway.php'
            - '../src/Module/Shipping/FakeShippingProvider.php'
            - '../src/Module/Shipping/TestCarrierShippingMethod.php'

    App\Module\Cms\CmsMediaStorage:
        arguments:
            $directory: '%kernel.project_dir%/public/uploads/cms'

    # Every log line passes through this before any handler sees it. Tagged explicitly on the
    # logger prototype rather than left to ProcessorInterface autoconfiguration, because
    # autoconfiguration is exactly the kind of thing a later edit to this file can quietly
    # stop doing — and "the log redaction is gone" is not a failure any test would notice
    # unless the wiring itself is asserted. tests/Security/LogRedactionTest does that.
    App\Shared\Logging\RedactingLogProcessor:
        autoconfigure: false
        tags:
            - { name: 'monolog.processor' }

    # Audit rows go to their own channel so "what did the staff do" is one command rather
    # than a grep through a mixed log.
    App\Module\Audit\AuditLogger:
        arguments:
            $logger: '@monolog.logger.audit'

    # Security headers are environment-dependent (HSTS is production-only; the dev hot
    # reload script host is allowed outside production), so the environment is explicit
    # rather than read from a global.
    App\EventListener\SecurityHeadersSubscriber:
        arguments:
            $environment: '%kernel.environment%'

    # Stored media paths are absolute ("/uploads/..."), so the storefront must be told the
    # public base path to keep them reachable from the application directory.
    App\Twig\StorefrontMediaExtension:
        arguments:
            $assetsBasePath: '%app.public_base_path%'

    App\Module\Integration\B2b\ProductMediaStorageInterface:
        alias: App\Module\Integration\B2b\ProductMediaStorage

    App\Module\Integration\B2b\B2bRunProcessorInterface:
        alias: App\Module\Integration\B2b\B2bRunProcessor

    App\Module\Integration\B2b\B2bRunProcessor:
        arguments:
            $snapshotDirectory: '%env(EFE_B2B_SNAPSHOT_DIR)%'
            $batchSize: 250

    App\Module\Integration\B2b\Provider\Efe\EfeSnapshotDownloader:
        arguments:
            $endpointUrl: '%env(EFE_B2B_FEED_URL)%'
            $allowedHosts: '%env(csv:EFE_B2B_ALLOWED_HOSTS)%'
            $snapshotDirectory: '%env(EFE_B2B_SNAPSHOT_DIR)%'
            $maxBytes: 268435456
            $maxConnectDuration: 20
            $readTimeout: 120
            $overallTimeout: 600
            $maxRedirects: 3
            $caBundle: '%env(EFE_B2B_CA_BUNDLE)%'

    App\Module\Integration\B2b\Provider\Efe\EfeFeedNormalizer:
        arguments:
            $allowedHosts: '%env(csv:EFE_B2B_ALLOWED_HOSTS)%'

    App\Module\Integration\B2b\Provider\Efe\EfeFeedProvider:
        arguments:
            $endpointUrl: '%env(EFE_B2B_FEED_URL)%'
            $allowedHosts: '%env(csv:EFE_B2B_ALLOWED_HOSTS)%'

    App\Module\Integration\B2b\ProductMediaStorage:
        arguments:
            $directory: '%env(EFE_B2B_PRODUCT_MEDIA_DIR)%'
            $allowedHosts: '%env(csv:EFE_B2B_ALLOWED_HOSTS)%'
            $maxBytes: 5000000
            $maxConnectDuration: 10
            $readTimeout: 30
            $overallTimeout: 60
            $maxRedirects: 3
            $caBundle: '%env(EFE_B2B_CA_BUNDLE)%'

    App\Module\Integration\B2b\B2bSnapshotCleaner:
        arguments:
            $rootDirectory: '%env(EFE_B2B_SNAPSHOT_DIR)%'

    # Payment providers are redirected back to this base; it is configuration, never the
    # incoming request, so a Host header cannot aim a provider's redirect elsewhere.
    App\Module\Payment\PaymentPublicUrlFactory:
        arguments:
            $publicBaseUri: '%env(DEFAULT_URI)%'

    # A password reset link carries a single-use token that takes over the account. Building it
    # from the incoming request would let a Host header aim that token at a host the store does
    # not control, so its base comes from configuration for the same reason.
    App\Shared\PublicUrlGenerator:
        arguments:
            $publicBaseUri: '%env(DEFAULT_URI)%'

    # One implementation of the store-wide SEO facts, read from the admin-managed settings.
    App\Module\Seo\StoreSeoContextProvider:
        alias: App\Module\Seo\SettingsStoreSeoContextProvider

    # robots.txt is decided by the environment, not by a deployment detail nobody remembers:
    # only a production environment is ever crawlable.
    App\Module\Seo\RobotsTxtBuilder:
        arguments:
            $environment: '%kernel.environment%'

    # PayTR credentials come from the environment and are empty until the merchant enters them
    # in the uncommitted .env.local. The adapter stays wired either way and reports itself as not
    # production ready while they are missing, so a half-configured store never offers a payment
    # it cannot take and the container still boots.
    App\Module\Payment\Gateway\PayTR\PaytrConfiguration:
        arguments:
            $merchantId: '%env(PAYTR_MERCHANT_ID)%'
            $merchantKey: '%env(PAYTR_MERCHANT_KEY)%'
            $merchantSalt: '%env(PAYTR_MERCHANT_SALT)%'
            $testMode: '%env(bool:PAYTR_TEST_MODE)%'
            $paymentUrl: '%env(PAYTR_PAYMENT_URL)%'
            $refundUrl: '%env(PAYTR_REFUND_URL)%'

    # Override the default AssetMapper dev server subscriber to only intercept /yeni/assets/ requests.
    # The default public_prefix='/yeni' would cause the base subscriber to intercept ALL /yeni/
    # requests including application routes. This custom subscriber only handles asset paths.
    asset_mapper.dev_server_subscriber:
        class: App\EventListener\AssetMapperDevServerSubscriber
        arguments:
            $assetMapper: '@asset_mapper'
            $profiler: '@?profiler'
        tags: [kernel.event_subscriber]

when@test:
    services:
        App\Module\Loyalty\RewardService:
            autowire: true
            autoconfigure: true
            public: true
        App\Module\Checkout\CheckoutManager:
            autowire: true
            autoconfigure: true
            public: true
        App\Module\Integration\B2b\B2bResourceResolver:
            autowire: true
            autoconfigure: true
            public: true
        # Functional tests queue deterministic outcomes on the fake and read the payment
        # services back directly.
        App\Module\Payment\FakePaymentGateway:
            autowire: true
            autoconfigure: true
            public: true
        App\Module\Payment\PaymentGatewayRegistry:
            autowire: true
            autoconfigure: true
            public: true
        App\Module\Payment\PaymentInitiationService:
            autowire: true
            autoconfigure: true
            public: true
        App\Module\Payment\PaymentCallbackHandler:
            autowire: true
            autoconfigure: true
            public: true
        App\Module\Payment\PaymentRefundService:
            autowire: true
            autoconfigure: true
            public: true
        App\Module\Payment\PaymentAdminManager:
            autowire: true
            autoconfigure: true
            public: true
        # Functional tests read the shipping services back directly and drive the fake carrier.
        App\Module\Shipping\FakeShippingProvider:
            autowire: true
            autoconfigure: true
            public: true
        App\Module\Shipping\TestCarrierShippingMethod:
            autowire: true
            autoconfigure: true
        App\Module\Shipping\ShippingProviderRegistry:
            autowire: true
            autoconfigure: true
            public: true
        App\Module\Shipping\ShippingMethodRegistry:
            autowire: true
            autoconfigure: true
            public: true
        App\Module\Shipping\ShipmentOrchestrator:
            autowire: true
            autoconfigure: true
            public: true
        App\MessageHandler\CreateShipmentHandler:
            autowire: true
            autoconfigure: true
            public: true
        # Functional and integration tests read the returns service back directly and drive the
        # eligibility and quantity rules against a real database.
        App\Module\Returns\ReturnService:
            autowire: true
            autoconfigure: true
            public: true
        App\Module\Returns\ReturnPolicy:
            autowire: true
            autoconfigure: true
            public: true
        # Tests build this one against their own in-memory transport so they can count messages and
        # simulate an SMTP outage; the container's mailer is `null://null` and could do neither.
        App\Module\Notification\TransactionalNotificationService:
            autowire: true
            autoconfigure: true
            public: true
        # Redirect history and metadata overrides are read back directly by integration tests
        # so a rename can be proven to keep the old address rather than asserted in prose.
        App\Module\Seo\SlugRedirectRecorder:
            autowire: true
            autoconfigure: true
            public: true
        App\Module\Seo\SlugRedirectResolver:
            autowire: true
            autoconfigure: true
            public: true
        App\Module\Seo\SeoOverrideReader:
            autowire: true
            autoconfigure: true
            public: true
        App\Module\Seo\SeoMetadataFactory:
            autowire: true
            autoconfigure: true
            public: true
